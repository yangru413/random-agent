<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VALORANT 隨機特務抽選器</title>
    <style>
        :root {
            --bg-primary: #0F1923;
            --bg-secondary: #1B2733;
            --bg-card: #233140;
            --accent-red: #FF4655;
            --accent-red-hover: #E53E4E;
            --text-primary: #FFFFFF;
            --text-secondary: #B8C0CC;
            --border-color: #2F3E4E;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
            padding: 20px 10px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        h1 {
            color: var(--text-primary);
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        h1::before {
            content: '';
            display: inline-block;
            width: 12px;
            height: 24px;
            background-color: var(--accent-red);
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
        }

        @media (min-width: 900px) {
            .main-layout {
                grid-template-columns: 450px 1fr;
            }
        }

        .panel {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 20px;
            position: relative;
        }

        .panel-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
        }

        .wheel-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .wheel-wrapper {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 10px 0 20px 0;
        }

        /* 原生 HTML/CSS 轉盤容器 */
        #wheelDisc {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid var(--accent-red);
            box-shadow: 0 0 15px rgba(255, 70, 85, 0.3);
            position: relative;
            overflow: hidden;
            background-color: #1B2733;
            transition: transform 0.05s linear;
        }

        .wheel-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            background-color: #0F1923;
            border: 3px solid var(--accent-red);
            border-radius: 50%;
            z-index: 5;
        }

        /* 放置頭像的容器 */
        .slice-item {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 18px;
            pointer-events: none;
        }

        .slice-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--accent-red);
            background-color: var(--bg-primary);
        }

        .slice-text {
            font-size: 0.75rem;
            color: #FFF;
            background: rgba(0,0,0,0.6);
            padding: 2px 4px;
            border-radius: 2px;
        }

        .pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-top: 24px solid var(--accent-red);
            z-index: 10;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        .btn-group {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .btn {
            background-color: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 10px 16px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            border-radius: 2px;
            flex: 1;
            min-width: 80px;
            text-align: center;
        }

        .btn:hover:not(:disabled) {
            background-color: var(--border-color);
            border-color: var(--text-secondary);
        }

        .btn.active {
            border-color: var(--accent-red);
            background-color: rgba(255, 70, 85, 0.2);
        }

        .btn-primary {
            background-color: var(--accent-red);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 1.1rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .btn-primary:hover:not(:disabled) {
            background-color: var(--accent-red-hover);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            filter: grayscale(80%);
        }

        .tip-message {
            color: var(--accent-red);
            font-size: 0.85rem;
            text-align: center;
            min-height: 20px;
            margin-bottom: 10px;
        }

        .result-box {
            margin-top: 15px;
            width: 100%;
            background-color: var(--bg-card);
            border: 1px solid var(--accent-red);
            padding: 15px;
            text-align: center;
            border-radius: 4px;
            display: none;
        }

        .result-box.active {
            display: block;
        }

        .result-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid var(--accent-red);
            margin: 0 auto 10px auto;
            background-color: var(--bg-primary);
            object-fit: cover;
        }

        .result-name {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--text-primary);
        }

        .result-role {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }

        .filter-section {
            margin-bottom: 15px;
        }

        .filter-title {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .agent-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 10px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .agent-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 8px 4px;
            text-align: center;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .agent-card.selected {
            border-color: var(--accent-red);
            background-color: rgba(255, 70, 85, 0.15);
        }

        .agent-card.selected::after {
            content: '✓';
            position: absolute;
            top: 2px;
            right: 4px;
            color: var(--accent-red);
            font-size: 0.75rem;
            font-weight: bold;
        }

        .agent-card:not(.selected) {
            opacity: 0.4;
            filter: grayscale(60%);
        }

        .agent-avatar {
            width: 48px;
            height: 48px;
            border-radius: 4px;
            margin-bottom: 4px;
            background-color: var(--bg-primary);
            object-fit: cover;
        }

        .agent-name {
            font-size: 0.8rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .history-list {
            list-style: none;
            max-height: 200px;
            overflow-y: auto;
            margin-top: 10px;
        }

        .history-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            font-size: 0.85rem;
        }

        .history-item:first-child {
            border-left: 3px solid var(--accent-red);
        }

        .history-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .history-avatar {
            width: 32px;
            height: 32px;
            border-radius: 4px;
            background-color: var(--bg-primary);
        }

        .history-time {
            color: var(--text-secondary);
            font-size: 0.75rem;
        }

        .status-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(15, 25, 35, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            padding: 20px;
            text-align: center;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border-color);
            border-top: 4px solid var(--accent-red);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 12px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>VALORANT 隨機特務抽選器</h1>
        <div class="subtitle">選擇你的隊伍陣容，讓轉盤決定你的英雄</div>
    </header>

    <div class="main-layout">
        <div class="panel">
            <div class="panel-title">
                <span>隨機轉盤</span>
            </div>

            <div class="wheel-container">
                <div class="wheel-wrapper">
                    <div class="pointer"></div>
                    <div id="wheelDisc">
                        <div class="wheel-center"></div>
                        <div id="wheelContent"></div>
                    </div>
                </div>

                <div id="tipMessage" class="tip-message"></div>

                <button id="spinBtn" class="btn btn-primary">開始抽選</button>

                <div id="resultBox" class="result-box">
                    <img id="resultAvatar" class="result-avatar" src="" alt="特務頭像">
                    <div id="resultName" class="result-name">--</div>
                    <div id="resultRole" class="result-role">--</div>
                    <button id="reSpinBtn" class="btn btn-primary" style="padding: 8px;">重新抽選</button>
                </div>
            </div>

            <div style="margin-top: 24px;">
                <div class="panel-title" style="font-size: 1rem;">
                    <span>本次抽選紀錄</span>
                </div>
                <ul id="historyList" class="history-list">
                    <li class="history-item" style="color: var(--text-secondary); justify-content: center;">尚無歷史紀錄</li>
                </ul>
            </div>
        </div>

        <div class="panel">
            <div class="status-overlay" id="statusOverlay">
                <div class="spinner"></div>
                <div id="statusText">載入最新特務資料中...</div>
            </div>

            <div class="panel-title">
                <span>特務選取名單</span>
                <span id="selectedCount" style="font-size: 0.85rem; color: var(--accent-red);">已選取 0 / 0 名特務</span>
            </div>

            <div class="btn-group">
                <button id="selectAllBtn" class="btn">全選</button>
                <button id="resetBtn" class="btn">全部重置</button>
            </div>

            <div class="filter-section">
                <div class="filter-title">按定位批次選取：</div>
                <div class="btn-group">
                    <button class="btn role-btn" data-role="決鬥者">決鬥者</button>
                    <button class="btn role-btn" data-role="先鋒">先鋒</button>
                    <button class="btn role-btn" data-role="控場者">控場者</button>
                    <button class="btn role-btn" data-role="哨衛">哨衛</button>
                </div>
            </div>

            <div class="filter-section">
                <div class="filter-title">顯示檢視篩選：</div>
                <div class="btn-group">
                    <button class="btn filter-btn active" data-filter="ALL">全部顯示</button>
                    <button class="btn filter-btn" data-filter="決鬥者">決鬥者</button>
                    <button class="btn filter-btn" data-filter="先鋒">先鋒</button>
                    <button class="btn filter-btn" data-filter="控場者">控場者</button>
                    <button class="btn filter-btn" data-filter="哨衛">哨衛</button>
                </div>
            </div>

            <div id="agentGrid" class="agent-grid"></div>
        </div>
    </div>
</div>

<script>
const state = {
    agents: [],
    selectedUuids: new Set(),
    isSpinning: false,
    currentRotationDeg: 0,
    history: [],
    activeFilter: 'ALL'
};

const wheelDisc = document.getElementById('wheelDisc');
const wheelContent = document.getElementById('wheelContent');
const spinBtn = document.getElementById('spinBtn');
const reSpinBtn = document.getElementById('reSpinBtn');
const tipMessage = document.getElementById('tipMessage');
const selectedCountEl = document.getElementById('selectedCount');
const agentGridEl = document.getElementById('agentGrid');
const historyListEl = document.getElementById('historyList');
const resultBox = document.getElementById('resultBox');
const resultAvatar = document.getElementById('resultAvatar');
const resultName = document.getElementById('resultName');
const resultRole = document.getElementById('resultRole');
const statusOverlay = document.getElementById('statusOverlay');
const statusText = document.getElementById('statusText');

async function initApp() {
    try {
        const response = await fetch('https://valorant-api.com/v1/agents?language=zh-TW&isPlayableCharacter=true');
        if (!response.ok) throw new Error(`HTTP 錯誤: ${response.status}`);
        
        const data = await response.json();
        if (!data.data || !Array.isArray(data.data)) throw new Error('資料結構不符合預期');

        state.agents = data.data.map(agent => ({
            uuid: agent.uuid,
            displayName: agent.displayName,
            icon: agent.displayIconSmall || agent.displayIcon || '',
            roleName: agent.role ? agent.role.displayName : '其他'
        }));

        selectAllAgents();
        statusOverlay.style.display = 'none';
        setupEventListeners();
        renderAgentGrid();
        updateUI();

    } catch (err) {
        console.error('API 載入失敗:', err);
        statusText.innerHTML = `<span style="color: var(--accent-red);">特務資料載入失敗</span><br><span style="font-size:0.8rem; color:#aaa;">請檢查網路連線或重新整理頁面</span>`;
    }
}

// 動態生成 CSS 圓錐漸層與圖片 HTML 節點
function renderWheel() {
    const activeAgents = getActiveAgents();
    wheelContent.innerHTML = '';

    if (activeAgents.length === 0) {
        wheelDisc.style.background = '#1B2733';
        return;
    }

    const total = activeAgents.length;
    const sliceAngle = 360 / total;

    // 1. 生成 CSS 圓錐漸層做為扇區背景
    let gradientStops = [];
    activeAgents.forEach((_, i) => {
        const color = (i % 2 === 0) ? '#233140' : '#1B2733';
        const start = i * sliceAngle;
        const end = (i + 1) * sliceAngle;
        gradientStops.push(`${color} ${start}deg ${end}deg`);
    });
    wheelDisc.style.background = `conic-gradient(${gradientStops.join(', ')})`;

    // 2. 放置圖片元素，正向朝向中心點
    activeAgents.forEach((agent, i) => {
        const item = document.createElement('div');
        item.className = 'slice-item';
        
        // 旋轉至扇區中心
        const angle = i * sliceAngle + sliceAngle / 2;
        item.style.transform = `rotate(${angle}deg)`;

        if (agent.icon) {
            const img = document.createElement('img');
            img.className = 'slice-avatar';
            img.src = agent.icon;
            img.alt = agent.displayName;
            img.onerror = () => {
                img.replaceWith(createTextFallback(agent.displayName));
            };
            item.appendChild(img);
        } else {
            item.appendChild(createTextFallback(agent.displayName));
        }

        wheelContent.appendChild(item);
    });
}

function createTextFallback(name) {
    const span = document.createElement('span');
    span.className = 'slice-text';
    span.textContent = name.substring(0, 2);
    return span;
}

function spinWheel() {
    const activeAgents = getActiveAgents();
    if (activeAgents.length === 0 || state.isSpinning) return;

    state.isSpinning = true;
    updateUI();
    resultBox.classList.remove('active');

    const selectedIndex = Math.floor(Math.random() * activeAgents.length);
    const winningAgent = activeAgents[selectedIndex];

    const total = activeAgents.length;
    const sliceAngle = 360 / total;

    // 指針固定在頂部 (0度)，計算需要旋轉的角度
    const targetAngle = selectedIndex * sliceAngle + sliceAngle / 2;
    const extraRounds = 5 + Math.floor(Math.random() * 3);
    
    // 計算最終轉動總角度
    const currentBase = state.currentRotationDeg - (state.currentRotationDeg % 360);
    const finalRotation = currentBase + (extraRounds * 360) + (360 - targetAngle);

    const startTime = performance.now();
    const duration = 2500;
    const startRotation = state.currentRotationDeg;

    function animate(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const easeOut = 1 - Math.pow(1 - progress, 3);

        state.currentRotationDeg = startRotation + (finalRotation - startRotation) * easeOut;
        wheelDisc.style.transform = `rotate(${state.currentRotationDeg}deg)`;

        if (progress < 1) {
            requestAnimationFrame(animate);
        } else {
            state.isSpinning = false;
            showResult(winningAgent);
            addHistory(winningAgent);
            updateUI();
        }
    }

    requestAnimationFrame(animate);
}

function getActiveAgents() {
    return state.agents.filter(a => state.selectedUuids.has(a.uuid));
}

function selectAllAgents() {
    state.agents.forEach(a => state.selectedUuids.add(a.uuid));
}

function deselectAllAgents() {
    state.selectedUuids.clear();
}

function toggleAgent(uuid) {
    if (state.selectedUuids.has(uuid)) {
        state.selectedUuids.delete(uuid);
    } else {
        state.selectedUuids.add(uuid);
    }
}

function selectRoleBatch(roleName) {
    state.agents.forEach(a => {
        if (a.roleName === roleName) {
            state.selectedUuids.add(a.uuid);
        }
    });
}

function updateUI() {
    const activeAgents = getActiveAgents();
    const count = activeAgents.length;
    const total = state.agents.length;

    selectedCountEl.textContent = `已選取 ${count} / ${total} 名特務`;

    if (count === 0) {
        spinBtn.disabled = true;
        tipMessage.textContent = '請先勾選特務以開始抽選';
    } else if (state.isSpinning) {
        spinBtn.disabled = true;
        tipMessage.textContent = '抽選中...';
    } else {
        spinBtn.disabled = false;
        tipMessage.textContent = '';
    }

    document.querySelectorAll('.agent-card').forEach(card => {
        const uuid = card.dataset.uuid;
        if (state.selectedUuids.has(uuid)) {
            card.classList.add('selected');
        } else {
            card.classList.remove('selected');
        }
    });

    renderWheel();
}

function renderAgentGrid() {
    agentGridEl.innerHTML = '';

    const filteredAgents = state.agents.filter(agent => {
        if (state.activeFilter === 'ALL') return true;
        return agent.roleName === state.activeFilter;
    });

    filteredAgents.forEach(agent => {
        const card = document.createElement('div');
        card.className = `agent-card ${state.selectedUuids.has(agent.uuid) ? 'selected' : ''}`;
        card.dataset.uuid = agent.uuid;

        const img = document.createElement('img');
        img.className = 'agent-avatar';
        img.src = agent.icon;
        img.alt = agent.displayName;
        img.onerror = () => {
            img.style.display = 'none';
        };

        const name = document.createElement('div');
        name.className = 'agent-name';
        name.textContent = agent.displayName;

        card.appendChild(img);
        card.appendChild(name);

        card.addEventListener('click', () => {
            if (state.isSpinning) return;
            toggleAgent(agent.uuid);
            updateUI();
        });

        agentGridEl.appendChild(card);
    });
}

function showResult(agent) {
    resultAvatar.src = agent.icon;
    resultName.textContent = agent.displayName;
    resultRole.textContent = `定位：${agent.roleName}`;
    resultBox.classList.add('active');
}

function addHistory(agent) {
    const timeStr = new Date().toLocaleTimeString('zh-TW', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
    state.history.unshift({ agent, time: timeStr });
    renderHistory();
}

function renderHistory() {
    if (state.history.length === 0) {
        historyListEl.innerHTML = '<li class="history-item" style="color: var(--text-secondary); justify-content: center;">尚無歷史紀錄</li>';
        return;
    }

    historyListEl.innerHTML = state.history.map((item, idx) => `
        <li class="history-item">
            <div class="history-info">
                <span style="color: var(--text-secondary); width: 20px;">#${state.history.length - idx}</span>
                <img class="history-avatar" src="${item.agent.icon}" alt="" onerror="this.style.opacity=0">
                <span style="font-weight: bold;">${item.agent.displayName}</span>
            </div>
            <span class="history-time">${item.time}</span>
        </li>
    `).join('');
}

function setupEventListeners() {
    spinBtn.addEventListener('click', spinWheel);
    reSpinBtn.addEventListener('click', spinWheel);

    document.getElementById('selectAllBtn').addEventListener('click', () => {
        if (state.isSpinning) return;
        selectAllAgents();
        updateUI();
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
        if (state.isSpinning) return;
        deselectAllAgents();
        resultBox.classList.remove('active');
        updateUI();
    });

    document.querySelectorAll('.role-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            if (state.isSpinning) return;
            const role = e.target.dataset.role;
            selectRoleBatch(role);
            updateUI();
        });
    });

    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            state.activeFilter = e.target.dataset.filter;
            renderAgentGrid();
        });
    });
}

window.addEventListener('DOMContentLoaded', initApp);
</script>
</body>
</html>
